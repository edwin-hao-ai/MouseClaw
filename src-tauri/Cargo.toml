[package]
name = "mouseclaw"
version = "0.5.0"
description = "🦞 鼠标龙虾 — 像素小老鼠 AI 桌面助手"
authors = ["edwin-hao-ai"]
edition = "2021"

[lib]
name = "mouseclaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "fs", "sync"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
# Voice input — sherpa-onnx streaming Zipformer (v0.3 · Whisper deleted)
cpal = "0.15"
hound = "3.5"
# Streaming on-device ASR + TTS + VAD via k2-fsa next-gen Kaldi
# Auto-downloads prebuilt static libs from GitHub releases at build time
# https://docs.rs/sherpa-onnx
sherpa-onnx = "1.13"
# v0.6 · 本地小模型（Qwen3-0.6B ONNX）—— 没装 CLI 时兜底基础任务（清理/翻译/整理）。
# 纯 Rust + ONNX Runtime（与 sherpa 同一家），无 Python、无新运行时。Spike 已验共存。
ort = { version = "=2.0.0-rc.12", features = ["half", "ndarray"] }
tokenizers = "0.21"
half = "2"
ndarray = "0.17"
once_cell = "1"
regex = "1.12.3"
# v0.4.4 · 长期记忆本地存储 —— bundled SQLite(自带,无系统依赖,含 FTS5)。
# 无向量库:检索靠关系表 + 时近/重要度打分,见 docs/design/pet-identity-and-memory-20260521.md
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = { version = "0.10", features = ["alloc"] }
base64 = "0.22"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-autostart = "2"

# 剪贴板加密 master key 的安全存储后端（v0.5 跨平台移植）：
#   macOS  → security-framework（Keychain，保留现有用户的条目语义，见下）
#   Win    → keyring → Windows Credential Manager
#   Linux  → keyring → Secret Service（无 keyring daemon 时 clipboard_crypto 退回 0600 文件）
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
block = "0.1"
core-graphics = "0.24"
core-foundation = "0.10"
security-framework = "2"
# v0.5 · 把桌宠 overlay 转成真正的 NSPanel —— 普通 NSWindow 在 release 下设
# collectionBehavior/level 浮不到全屏 app 之上（Tauri #5566 / #9556）。NSPanel 是这类
# "桌宠/HUD 浮全屏"的标准方案（BongoCat / Cap / Screenpipe 都用它）。macOS 专属。
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

# 所有 unix（macOS + Linux）：lower_priority 用 setpriority（nice）。Windows 走 no-op 分支。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 非 macOS（Windows + Linux）：
#   keyring → 剪贴板密钥 OS keystore
#   arboard → 跨平台剪贴板读写（macOS 仍用 NSPasteboard，故仅非 mac 引入）
#            Linux：X11 走纯 Rust x11rb；Wayland 走 wl-clipboard-rs（无 display 时优雅失败）
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "3"
arboard = "3"
xcap = "0.9.4"
enigo = "0.6.1"
tts = "0.26.3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["screensaver"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_DataExchange"] }

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "mouseclaw"
version = "0.4.7"
description = "🦞 鼠标龙虾 — 像素小老鼠 AI 桌面助手"
authors = ["edwin-hao-ai"]
edition = "2021"

[lib]
name = "mouseclaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "fs", "sync"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
# Voice input — sherpa-onnx streaming Zipformer (v0.3 · Whisper deleted)
cpal = "0.15"
hound = "3.5"
# Streaming on-device ASR + TTS + VAD via k2-fsa next-gen Kaldi
# Auto-downloads prebuilt static libs from GitHub releases at build time
# https://docs.rs/sherpa-onnx
sherpa-onnx = "1.13"
once_cell = "1"
regex = "1.12.3"
# v0.4.4 · 长期记忆本地存储 —— bundled SQLite(自带,无系统依赖,含 FTS5)。
# 无向量库:检索靠关系表 + 时近/重要度打分,见 docs/design/pet-identity-and-memory-20260521.md
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = { version = "0.10", features = ["alloc"] }
base64 = "0.22"
rand = "0.8"
security-framework = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
block = "0.1"
core-graphics = "0.24"
core-foundation = "0.10"
libc = "0.2"
# v0.5 · 把桌宠 overlay 转成真正的 NSPanel —— 普通 NSWindow 在 release 下设
# collectionBehavior/level 浮不到全屏 app 之上（Tauri #5566 / #9556）。NSPanel 是这类
# "桌宠/HUD 浮全屏"的标准方案（BongoCat / Cap / Screenpipe 都用它）。
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[dev-dependencies]
tempfile = "3.27.0"

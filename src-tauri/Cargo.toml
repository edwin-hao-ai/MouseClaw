[package]
name = "mouseclaw"
version = "0.1.0"
description = "🦞 鼠标龙虾 — 像素小老鼠 AI 桌面助手"
authors = ["edwin-hao-ai"]
edition = "2021"

[lib]
name = "mouseclaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "fs", "sync"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
# Whisper voice input
cpal = "0.15"
hound = "3.5"
whisper-rs = { version = "0.14", default-features = false }
once_cell = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-graphics = "0.24"

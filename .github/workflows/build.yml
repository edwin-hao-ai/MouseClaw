name: build

# 跨平台构建 / 编译验证矩阵（v0.5 跨平台移植）。
# - Linux / Windows：完整 `tauri build`，产出 .deb/.AppImage / .nsis 安装包并上传 artifact。
# - macOS：仅 `cargo build`（编译验证）—— 签名 / 公证用本地 keychain 跑（CI 无证书），
#   见 docs/design/cross-platform-port-20260522.md。
#
# 设计意图：开发容器是无头 Linux，没法构建 Windows / macOS；本 workflow 是这两端的
# **编译验证手段**。注意 CI 绿只代表「编译/链接通过」，运行时行为仍需真机验证。

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# 同分支新 push 取消旧 run，省 CI 时间
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: true
          - os: windows-latest
            bundle: true
          - os: macos-latest
            bundle: false # 签名需本地 keychain；CI 只做编译验证
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            libxdo-dev \
            libx11-dev libxtst-dev libxi-dev libatspi2.0-dev \
            patchelf file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend deps
        run: bun install

      - name: Build frontend (tsc + vite)
        run: bun run build

      # Windows / Linux：完整打包，产出安装器。
      - name: Tauri build (bundle)
        if: matrix.bundle
        run: bun run tauri build

      # macOS：仅编译验证（不签名 / 不打包）。
      - name: Cargo build (compile check, macOS)
        if: ${{ !matrix.bundle }}
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Upload installers
        if: matrix.bundle
        uses: actions/upload-artifact@v4
        with:
          name: mouseclaw-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
